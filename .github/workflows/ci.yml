name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1 -timeout 120s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...
