name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Install SCIP indexers
        run: |
          go install github.com/sourcegraph/scip-go/cmd/scip-go@v0.1.26
          npm install -g @sourcegraph/scip-typescript@0.4.0

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1 -timeout 120s

      - name: SCIP index
        env:
          CGO_ENABLED: "1"
        run: go run ./cmd/tracescope index .

      - name: SCIP validation
        env:
          CGO_ENABLED: "1"
        run: go run ./cmd/tracescope validate-scip .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...
