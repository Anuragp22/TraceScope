name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Install SCIP indexers
        run: |
          go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.6
          npm install -g @sourcegraph/scip-typescript@0.4.0

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1 -timeout 120s

      - name: SCIP index
        env:
          CGO_ENABLED: "1"
        run: go run ./cmd/tracescope index .

      - name: SCIP validation
        env:
          CGO_ENABLED: "1"
        run: go run ./cmd/tracescope validate-scip .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Placeholders so the build doesn't fail on missing runtime secrets;
          # real values are injected at deploy time.
          GITHUB_CLIENT_ID: build-placeholder
          GITHUB_CLIENT_SECRET: build-placeholder
          BETTER_AUTH_SECRET: build-placeholder-secret-do-not-use
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build
