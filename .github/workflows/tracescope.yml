name: TraceScope PR Analysis

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Install SCIP indexers
        run: |
          go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.6
          npm install -g @sourcegraph/scip-typescript@0.4.0

      - name: Build TraceScope
        env:
          CGO_ENABLED: "1"
        run: go build -o tracescope ./cmd/tracescope

      - name: Index codebase
        env:
          CGO_ENABLED: "1"
        run: ./tracescope index .

      - name: Analyze blast radius
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          # Diff the PR's own base..head from the event SHAs. On a pull_request
          # the checkout is the merge commit, so `origin/<base>...HEAD` can yield
          # an empty diff; the event SHAs always resolve to the PR's real changes.
          DIFF=$(git diff "${BASE_SHA}...${HEAD_SHA}")
          if [ -z "$DIFF" ]; then
            echo "No changes between base and head; nothing to analyze."
            exit 0
          fi
          printf '%s\n' "$DIFF" | ./tracescope analyze --github-comment --owners --top 15
          code=${PIPESTATUS[1]}
          echo "tracescope exit code: $code"
          # Exit-code contract (internal/cmd/exit.go): 0 ok, 1 HIGH risk,
          # 2 MEDIUM risk, 3 tool failure. Block the PR on HIGH or a tool
          # failure; let MEDIUM through as advisory (the comment still posts).
          if [ "$code" = "1" ] || [ "$code" = "3" ]; then
            exit "$code"
          fi
          exit 0
